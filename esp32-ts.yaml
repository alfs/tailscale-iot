esphome:
  name: esp32-ts
  friendly_name: ESP32 Tailscale

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # Increase task watchdog timeout from default 5s to 30s
      # This allows longer network operations during TS2021 handshake
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      # Enable certificate bundle for TLS verification
      # Use custom bundle with only Let's Encrypt certificates instead of full bundle
      # This saves ~145KB flash and reduces RAM usage during TLS verification
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: y
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL: n
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_CUSTOM: y
      CONFIG_MBEDTLS_CUSTOM_CERTIFICATE_BUNDLE_PATH: "certs"

      # mbedTLS Memory Optimizations (saves ~48KB total)
      # Reduce TLS buffer size from 16KB to 3KB per buffer (saves 26KB)
      # Reduced from 4KB to 3KB to allow two TLS connections (control + DERP)
      # Most Tailscale control messages are <3KB, and HTTP/2 chunks larger responses
      CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN: "3072"

      # Enable dynamic buffer allocation (saves ~20KB)
      # Buffers are allocated only when needed and freed after use
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: y
      CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA: y
      CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT: y

      # Disable peer certificate retention (saves 3.6KB)
      # We don't need to inspect the peer certificate after validation
      CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE: n

      # Enable variable-length buffers (saves 1KB)
      CONFIG_MBEDTLS_SSL_VARIABLE_BUFFER_LENGTH: y

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

# Enable logging
logger:
  #level: INFO
  #level: DEBUG
  level: VERBOSE
  logs:
    tailscale.wireguard: VERBOSE

# Time source (required)
time:
  - platform: sntp
    id: sntp_time
    # Can probably be removed in your config.
    # tz is needed docker build environment
    timezone: Europe/Stockholm

external_components:
  - source:
      type: local
      path: components
    components: [ tailscale ]

tailscale:
  id: tailscale_client
  auth_key: !secret tailscale_auth_key
  control_url: !secret headscale_url
  device_name: "esp"
  time_id: sntp_time
  update_interval: 5s  # Reduced from 5s to 2s for faster reconnection checks
  allowed_peers: !secret allowed_peers
  preferred_derp: 999
  prefer_direct_udp: true # Prefer direct UDP routing after Disco PONG confirmation, else use DERP
  # LED status indicator (WS2812 addressable LED)
  #   Orange (20%) - Connecting
  #   Green (20%)  - Connected/OK
  #   Red (20%)    - Error
  #   Blue blink   - Control packets (disco, wireguard handshake)
  #   Orange blink - Data packets (ICMP, TCP)
  status_led:
    enabled: false
    pin: 10  # GPIO10 for ESP32-C3 Zero onboard WS2812

