# Compile-only fixture. No real credentials; never flash this configuration.
esphome:
  name: tailscale-c3-build

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
    version: 5.3.2

wifi:
  ssid: build-fixture
  password: not-a-network-password

logger:
  level: INFO

time:
  - platform: sntp
    id: build_time
    timezone: UTC

external_components:
  - source:
      type: local
      path: ../components
    components: [tailscale]

tailscale:
  auth_key: ""
  control_url: https://controlplane.tailscale.com
  time_id: build_time
  allowed_peers: []
  status_led:
    enabled: false
